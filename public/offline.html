<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171717" />
    <title>Sin conexión · Boticas ERP</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 1.5rem;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #fafafa; color: #171717; text-align: center;
      }
      @media (prefers-color-scheme: dark) { body { background: #0d0d0d; color: #f0efec; } }
      main { max-width: 26rem; }
      h1 { font-size: 1.4rem; margin: 0.75rem 0 0.5rem; }
      p { margin: 0.5rem 0; line-height: 1.5; color: #6b6b6b; }
      @media (prefers-color-scheme: dark) { p { color: #c3c2b7; } }
      button {
        margin-top: 1rem; padding: 0.7rem 1.3rem; font: inherit; font-weight: 600; border: 0; border-radius: 0.6rem;
        background: #171717; color: #fff; cursor: pointer;
      }
      @media (prefers-color-scheme: dark) { button { background: #f0efec; color: #171717; } }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" width="72" height="72" alt="" />
      <h1>Sin conexión</h1>
      <p>Boticas ERP necesita internet para vender y consultar tu inventario: los datos viven en la nube.</p>
      <p>No se pierde nada de lo ya registrado. Revisa tu conexión e inténtalo de nuevo.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
